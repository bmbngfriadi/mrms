<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background Putih -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Icon Ruangan Kecil di Tengah (Merah & Abu-abu) -->
  <g transform="translate(136, 136) scale(0.46875)">
    <!-- Bingkai / Dinding Ruangan (Abu-abu) -->
    <rect x="48" y="64" width="416" height="360" rx="28" fill="#F8FAFC" stroke="#64748B" stroke-width="26"/>

    <!-- Pintu Ruangan Terbuka di Sisi Kiri (Merah) -->
    <path d="M 96 424 L 96 156 L 198 136 L 198 404 Z" fill="#B52025"/>
    <circle cx="176" cy="284" r="10" fill="#FFFFFF"/>

    <!-- Layar Presentasi di Dinding Ruangan (Merah & Abu-abu) -->
    <rect x="236" y="120" width="176" height="108" rx="12" fill="#E2E8F0" stroke="#64748B" stroke-width="14"/>
    <rect x="258" y="144" width="92" height="16" rx="8" fill="#B52025"/>
    <rect x="258" y="174" width="132" height="12" rx="6" fill="#94A3B8"/>

    <!-- Meja Rapat & Kursi di Tengah Ruangan (Abu-abu & Merah) -->
    <rect x="234" y="294" width="180" height="28" rx="14" fill="#475569"/>
    <rect x="268" y="322" width="20" height="52" rx="8" fill="#64748B"/>
    <rect x="360" y="322" width="20" height="52" rx="8" fill="#64748B"/>

    <!-- Kursi Kiri & Kanan (Merah) -->
    <rect x="248" y="264" width="44" height="18" rx="9" fill="#B52025"/>
    <rect x="356" y="264" width="44" height="18" rx="9" fill="#B52025"/>

    <!-- Garis Lantai Ruangan (Abu-abu) -->
    <line x1="24" y1="424" x2="488" y2="424" stroke="#475569" stroke-width="24" stroke-linecap="round"/>
  </g>
</svg>
