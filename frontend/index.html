<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Meeting Room Management System | PT Cemindo Gemilang Tbk - Plant Batam</title>

    <!-- PWA & Web App Manifest -->
    <link rel="manifest" href="/mrms/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="MRMS Cemindo" />

    <!-- Apple iOS Safari PWA Meta & Icons -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MRMS Cemindo" />
    <link rel="apple-touch-icon" sizes="180x180" href="/mrms/apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="/mrms/pwa-512x512.png" />

    <!-- Browser Favicons (Tab Bar / Address Bar) -->
    <link rel="icon" type="image/svg+xml" href="/mrms/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/mrms/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/mrms/favicon-16x16.png" />
    <link rel="shortcut icon" href="/mrms/favicon.png" />

    <script>
      (function() {
        try {
          var theme = localStorage.getItem('mrms_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            var baseScope = window.location.pathname.indexOf('/meeting-room') === 0 ? '/meeting-room/' : '/mrms/';
            navigator.serviceWorker.register('/mrms/sw.js', { scope: baseScope })
              .then(function(reg) {
                console.log('[PWA] Service Worker registered with scope:', reg.scope);
              })
              .catch(function(err) {
                console.warn('[PWA] Service Worker registration failed:', err);
              });
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
