server {
    listen 80;
    server_name localhost;

    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location = / {
        return 301 /mrms/;
    }

    location = /mrms {
        return 301 /mrms/;
    }

    location = /meeting-room {
        return 301 /mrms/;
    }

    # API Proxy for /mrms/api/
    location /mrms/api/ {
        proxy_pass http://backend:5000/mrms/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # API Proxy for /meeting-room/api/ (backward compatibility)
    location /meeting-room/api/ {
        proxy_pass http://backend:5000/meeting-room/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # Static Assets for /mrms/
    location /mrms/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static Assets for /meeting-room/ (backward compatibility)
    location /meeting-room/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Frontend Single Page App (SPA) for /mrms/
    location /mrms/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /mrms/index.html;
    }

    # Frontend Single Page App (SPA) for /meeting-room/ (backward compatibility)
    location /meeting-room/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /mrms/index.html;
    }

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
